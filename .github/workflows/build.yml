name: Build UZZ TUNNEL APK
"on":
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-java@v4
          with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true   
       - uses: android-actions/setup-android@v3
        with:
       api-level: 35
       build-tools: 35.0.0
      - name: Generate Android folder
        run: |
          flutter create . --project-name uzz_tunnel --platforms android
          flutter pub get
      - name: Fix SDK to 35
        run: |
          sed -i 's/compileSdk.*/compileSdk = 35/' android/app/build.gradle.kts || true
          sed -i 's/targetSdk.*/targetSdk = 35/' android/app/build.gradle.kts || true
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: UZZ-TUNNEL-APK
          path: build/app/outputs/flutter-apk/app-release.apk
